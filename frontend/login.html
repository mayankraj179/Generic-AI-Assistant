<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assistant Sign In</title>
    <!-- No favicon: stops the browser's automatic /favicon.ico 404. -->
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #f4f5f7;
        --panel: #ffffff;
        --border: #dfe3e8;
        --text: #1a1d21;
        --muted: #6b7280;
        --accent: #4f46e5;
        --accent-hover: #4338ca;
        --error-bg: #fef2f2;
        --error-border: #fecaca;
        --error-text: #991b1b;
        --info-bg: #eff6ff;
        --info-border: #bfdbfe;
        --info-text: #1e3a8a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
      }
      [hidden] {
        display: none !important;
      }
      .login-screen {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 28px 24px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      }
      .card h1 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      .card .subtitle {
        margin: 0 0 20px;
        font-size: 13px;
        color: var(--muted);
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      label {
        font-size: 13px;
        font-weight: 600;
        margin-top: 8px;
      }
      input {
        font: inherit;
        font-size: 14px;
        padding: 9px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      input:focus,
      select:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }
      button {
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        border: none;
        border-radius: 6px;
        padding: 10px 16px;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
      }
      button:hover:not(:disabled) {
        background: var(--accent-hover);
      }
      button:disabled {
        opacity: 0.6;
        cursor: progress;
      }
      button.secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
        padding: 6px 12px;
        font-size: 13px;
      }
      button.secondary:hover:not(:disabled) {
        background: var(--bg);
      }
      #login-button {
        margin-top: 16px;
      }
      .message {
        margin: 0 0 12px;
        padding: 10px 12px;
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.4;
      }
      .message.error {
        background: var(--error-bg);
        border: 1px solid var(--error-border);
        color: var(--error-text);
      }
      .message.info {
        background: var(--info-bg);
        border: 1px solid var(--info-border);
        color: var(--info-text);
      }
      .app-screen {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        font-size: 13px;
      }
      .topbar .who {
        color: var(--muted);
      }
      .topbar .who strong {
        color: var(--text);
      }
      .topbar .spacer {
        flex: 1;
      }
      .topbar select {
        font: inherit;
        font-size: 13px;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        max-width: 100%;
      }
      .content {
        flex: 1;
        padding: 20px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .content .message {
        width: 100%;
        max-width: 640px;
      }
      #widget-container {
        display: inline-block;
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Login screen -->
    <main class="login-screen" id="login-screen">
      <div class="card">
        <h1>Sign in</h1>
        <p class="subtitle">Generic AI Assistant: development realm</p>
        <p class="message error" id="login-error" role="alert" hidden></p>
        <p class="message info" id="login-info" role="status" hidden></p>
        <form id="login-form" novalidate>
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required />
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
          <button type="submit" id="login-button">Log in</button>
        </form>
      </div>
    </main>

    <!-- Signed-in screen -->
    <div class="app-screen" id="app-screen" hidden>
      <header class="topbar">
        <!-- SELECTOR_MODE "two-step" -->
        <span id="two-step-picker" hidden>
          <label for="use-case-select" style="margin: 0 6px 0 0">Use case</label>
          <select id="use-case-select"></select>
          <label for="provider-select" style="margin: 0 6px 0 12px">Provider</label>
          <select id="provider-select"></select>
        </span>
        <!-- SELECTOR_MODE "flat" (fallback) -->
        <span id="assistant-picker" hidden>
          <label for="assistant-select" style="margin: 0 6px 0 0">Assistant</label>
          <select id="assistant-select" aria-label="Assistant"></select>
        </span>
        <span class="spacer"></span>
        <span class="who" id="who"></span>
        <button type="button" class="secondary" id="logout-button">Log out</button>
      </header>
      <section class="content">
        <p class="message error" id="app-error" role="alert" hidden></p>
        <div id="widget-container"></div>
      </section>
    </div>

    <script type="module" src="/src/widget.tsx"></script>
    <script type="module">
      // ---- Demo configuration -------------------------------------------
      // The same token request README.md's curl makes: Resource Owner
      // Password Credentials against the realm's public client.
      const KEYCLOAK_TOKEN_URL =
        "http://localhost:8080/realms/generic-ai-dev/protocol/openid-connect/token";
      const CLIENT_ID = "generic-ai-api";
      const API_BASE = "http://localhost:8000";
      const REQUEST_TIMEOUT_MS = 10000;

      // ---- Assistant selection -------------------------------------------
      // "two-step": pick a use case, then a provider; each pair maps to an
      // existing assistant_id. "flat": one dropdown of every assistant the
      // backend returns, minus FLAT_HIDDEN_IDS. Set to "flat" if the two-step
      // picker misbehaves; nothing else needs to change.
      const SELECTOR_MODE = "two-step";

      // Only providers verified working for the use case are listed. As of
      // 2026-09-30 that is Azure alone: no config uses Gemini chat; the only
      // OpenRouter config is an inactive finance example (configs/examples/)
      // on an exhausted free quota; the Grok configs' XAI_API_KEY is rejected
      // by xAI. hr_assistant_azure duplicates hr_assistant, so HR / Azure
      // maps to hr_assistant. A pair whose assistant_id the backend doesn't
      // return is dropped automatically.
      const USE_CASES = [
        {
          key: "hr",
          label: "HR Policy",
          providers: [{ key: "azure", label: "Azure", assistantId: "hr_assistant" }],
        },
        {
          key: "finance",
          label: "Financial Report Analysis",
          providers: [{ key: "azure", label: "Azure", assistantId: "finance_assistant" }],
        },
      ];
      const DEFAULT_USE_CASE = "hr";
      const DEFAULT_PROVIDER = "azure";

      // Flat mode: broken (Grok, rejected xAI key) or redundant assistants.
      const FLAT_HIDDEN_IDS = ["hr_assistant_azure", "hr_assistant_grok", "finance_assistant_grok"];
      const DEFAULT_ASSISTANT_ID = "hr_assistant";

      // ---- In-memory session: never written to the URL, storage or DOM --
      let session = null; // { token, username, expiresAt }
      let expiryTimer = undefined;

      const $ = (id) => document.getElementById(id);
      const loginScreen = $("login-screen");
      const appScreen = $("app-screen");
      const loginForm = $("login-form");
      const loginButton = $("login-button");
      const loginError = $("login-error");
      const loginInfo = $("login-info");
      const usernameInput = $("username");
      const passwordInput = $("password");
      const assistantSelect = $("assistant-select");
      const assistantPicker = $("assistant-picker");
      const twoStepPicker = $("two-step-picker");
      const useCaseSelect = $("use-case-select");
      const providerSelect = $("provider-select");
      let availableUseCases = []; // USE_CASES filtered to what the backend returns
      const who = $("who");
      const appError = $("app-error");
      const widgetContainer = $("widget-container");
      const logoutButton = $("logout-button");

      function show(el, text) {
        el.textContent = text;
        el.hidden = false;
      }
      function hide(el) {
        el.textContent = "";
        el.hidden = true;
      }

      async function fetchWithTimeout(url, options) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
        try {
          return await fetch(url, { ...options, signal: controller.signal });
        } finally {
          clearTimeout(timer);
        }
      }

      // Returns { token, expiresIn } or throws an Error whose message is
      // safe to show on screen.
      async function requestToken(username, password) {
        let response;
        try {
          response = await fetchWithTimeout(KEYCLOAK_TOKEN_URL, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams({
              grant_type: "password",
              client_id: CLIENT_ID,
              username,
              password,
            }),
          });
        } catch {
          throw new Error(
            "Can't reach the sign-in server (Keycloak at localhost:8080). " +
              "Check that it's running, then try again.",
          );
        }
        let body = {};
        try {
          body = await response.json();
        } catch {
          // Non-JSON body: fall through to the status-based message.
        }
        if (response.ok && body.access_token) {
          return { token: body.access_token, expiresIn: Number(body.expires_in) || 0 };
        }
        if (body.error === "invalid_grant") {
          throw new Error("Incorrect username or password.");
        }
        throw new Error(
          `Sign-in failed (${body.error_description || body.error || "HTTP " + response.status}).`,
        );
      }

      // Returns [{ assistant_id, display_name }] or throws a displayable Error.
      async function fetchAssistants(token) {
        let response;
        try {
          response = await fetchWithTimeout(`${API_BASE}/assistants`, {
            headers: { Authorization: `Bearer ${token}` },
          });
        } catch {
          throw new Error(
            "Signed in, but the assistant backend (localhost:8000) isn't reachable. " +
              "Check that it's running, then log out and in again.",
          );
        }
        if (!response.ok) {
          throw new Error(`Signed in, but the backend refused the request (HTTP ${response.status}).`);
        }
        return response.json();
      }

      function usernameFromToken(token, fallback) {
        try {
          const payload = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
          return JSON.parse(atob(payload)).preferred_username || fallback;
        } catch {
          return fallback;
        }
      }

      async function mountWidget(assistantId) {
        widgetContainer.replaceChildren();
        if (!session) return;
        // The element reads its attributes once, synchronously, in
        // connectedCallback. Waiting for the definition guarantees that read
        // happens during appendChild, so the token attribute can be removed
        // straight after and never stays in the DOM.
        await customElements.whenDefined("assistant-widget");
        const widget = document.createElement("assistant-widget");
        widget.setAttribute("assistant-id", assistantId);
        widget.setAttribute("api-base", API_BASE);
        widget.setAttribute("auth-token", session.token);
        widgetContainer.appendChild(widget);
        widget.removeAttribute("auth-token");
      }

      async function onLogin(event) {
        event.preventDefault();
        hide(loginError);
        hide(loginInfo);
        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        if (!username || !password) {
          show(loginError, "Enter a username and password.");
          return;
        }

        loginButton.disabled = true;
        loginButton.textContent = "Signing in…";
        try {
          const { token, expiresIn } = await requestToken(username, password);
          session = {
            token,
            username: usernameFromToken(token, username),
            expiresAt: Date.now() + expiresIn * 1000,
          };
        } catch (error) {
          show(loginError, error.message);
          passwordInput.select();
          return;
        } finally {
          loginButton.disabled = false;
          loginButton.textContent = "Log in";
        }

        // The password isn't needed again; don't leave it in the form.
        passwordInput.value = "";
        startExpiryTimer();
        await enterApp();
      }

      async function enterApp() {
        const expires = new Date(session.expiresAt).toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });
        who.innerHTML = "";
        who.append("Signed in as ");
        const name = document.createElement("strong");
        name.textContent = session.username;
        who.append(name, ` · session until ${expires}`);

        hide(appError);
        loginScreen.hidden = true;
        appScreen.hidden = false;

        clearPickers();
        let assistants;
        try {
          assistants = await fetchAssistants(session.token);
        } catch (error) {
          if (!session) return; // logged out meanwhile
          show(appError, error.message);
          return;
        }
        if (!session) return;
        if (!assistants.length) {
          show(appError, "Signed in, but no assistants are configured on the backend.");
          return;
        }
        const assistantId =
          SELECTOR_MODE === "flat" ? setUpFlatPicker(assistants) : setUpTwoStepPicker(assistants);
        if (!assistantId) {
          show(appError, "Signed in, but none of the demo assistants are available on the backend.");
          return;
        }
        await mountWidget(assistantId);
      }

      function addOption(select, value, text) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = text;
        select.append(option);
      }

      // Returns the assistant_id to mount first, or null if none is usable.
      function setUpFlatPicker(assistants) {
        const shown = assistants.filter((a) => !FLAT_HIDDEN_IDS.includes(a.assistant_id));
        if (!shown.length) return null;
        for (const a of shown) addOption(assistantSelect, a.assistant_id, `${a.display_name} (${a.assistant_id})`);
        const ids = shown.map((a) => a.assistant_id);
        assistantSelect.value = ids.includes(DEFAULT_ASSISTANT_ID) ? DEFAULT_ASSISTANT_ID : ids[0];
        assistantPicker.hidden = false;
        return assistantSelect.value;
      }

      function setUpTwoStepPicker(assistants) {
        const ids = new Set(assistants.map((a) => a.assistant_id));
        availableUseCases = USE_CASES.map((u) => ({
          ...u,
          providers: u.providers.filter((p) => ids.has(p.assistantId)),
        })).filter((u) => u.providers.length);
        if (!availableUseCases.length) return null;
        for (const u of availableUseCases) addOption(useCaseSelect, u.key, u.label);
        useCaseSelect.value = availableUseCases.some((u) => u.key === DEFAULT_USE_CASE)
          ? DEFAULT_USE_CASE
          : availableUseCases[0].key;
        fillProviders(DEFAULT_PROVIDER);
        twoStepPicker.hidden = false;
        return selectedTwoStepAssistantId();
      }

      // Refills the provider list for the chosen use case, keeping
      // `preferred` selected when that use case offers it.
      function fillProviders(preferred) {
        const useCase = availableUseCases.find((u) => u.key === useCaseSelect.value);
        providerSelect.replaceChildren();
        for (const p of useCase.providers) addOption(providerSelect, p.key, p.label);
        providerSelect.value = useCase.providers.some((p) => p.key === preferred)
          ? preferred
          : useCase.providers[0].key;
      }

      function selectedTwoStepAssistantId() {
        const useCase = availableUseCases.find((u) => u.key === useCaseSelect.value);
        return useCase.providers.find((p) => p.key === providerSelect.value).assistantId;
      }

      function clearPickers() {
        assistantSelect.replaceChildren();
        useCaseSelect.replaceChildren();
        providerSelect.replaceChildren();
        availableUseCases = [];
        assistantPicker.hidden = true;
        twoStepPicker.hidden = true;
      }

      function startExpiryTimer() {
        clearTimeout(expiryTimer);
        const remaining = session.expiresAt - Date.now();
        // No silent refresh (deliberately): when the token lapses, return to
        // the login form with an explanation instead of letting the widget
        // fail with "Not authenticated".
        expiryTimer = setTimeout(() => {
          logout("Your session expired. Please log in again.");
        }, Math.max(0, remaining - 5000));
      }

      function logout(infoMessage) {
        clearTimeout(expiryTimer);
        session = null;
        widgetContainer.replaceChildren(); // unmounts the widget's React root
        clearPickers();
        hide(appError);
        who.textContent = "";
        appScreen.hidden = true;
        loginScreen.hidden = false;
        hide(loginError);
        if (infoMessage) show(loginInfo, infoMessage);
        else hide(loginInfo);
        passwordInput.value = "";
        usernameInput.focus();
      }

      loginForm.addEventListener("submit", onLogin);
      logoutButton.addEventListener("click", () => logout());
      // Switching assistant starts a fresh conversation with the same token.
      assistantSelect.addEventListener("change", () => mountWidget(assistantSelect.value));
      useCaseSelect.addEventListener("change", () => {
        fillProviders(providerSelect.value);
        mountWidget(selectedTwoStepAssistantId());
      });
      providerSelect.addEventListener("change", () => mountWidget(selectedTwoStepAssistantId()));
      usernameInput.focus();
    </script>
  </body>
</html>

# Atlassian Jira Data Center / Server, REST API v2. Read-only: both
# operations use GET /rest/api/2/search (offset-paged with startAt and
# maxResults). Every query is a reviewed JQL template scoped to the signed-in
# user; the model only fills typed, escaped values.
#
# base_url: https://jira.your-company.com (plus any context path, e.g. /jira)
# auth: bearer (a personal access token of a read-only integration account,
#       Jira 8.14+) or basic (that account's username and password).
# identity: JQL user fields match the Jira username; an email works where it
#       resolves to exactly one user. Set identity.claim to whichever claim
#       holds the Jira username if those differ.
# allow_private_network: usually true, since Data Center runs on-prem.
type: jira_data_center
description: Jira Data Center / Server (REST API v2), read-only issue search scoped to the signed-in user.
auth_methods: [bearer, basic]
operations:
  - name: my_issues
    description: >-
      Searches Jira issues assigned to or reported by the signed-in user,
      most recently updated first. Optional filters: status category,
      project key, and words to search for.
    method: GET
    path: /rest/api/2/search
    parameters:
      user: {in: template, identity: true}
      status_category:
        in: template
        enum: [To Do, In Progress, Done]
        description: Optional, one status category.
      project:
        in: template
        pattern: "^[A-Z][A-Z0-9_]{1,19}$"
        description: Optional, a project key such as HR or IT.
      text:
        in: template
        max_length: 100
        description: Optional, words to search for in the issue text.
    templates:
      jql:
        language: jql
        parts:
          - "(assignee = {user} OR reporter = {user})"
          - "AND statusCategory = {status_category}"
          - "AND project = {project}"
          - "AND text ~ {text}"
          - "ORDER BY updated DESC"
    fixed_query:
      fields: summary,status,priority,issuetype,assignee,reporter,updated
    response:
      root: issues
      fields: [key, fields.summary, fields.status.name, fields.priority.name,
               fields.issuetype.name, fields.assignee.displayName,
               fields.reporter.displayName, fields.updated]
      max_items: 40
    pagination:
      strategy: offset
      offset_param: startAt
      page_size: 20
      page_size_param: maxResults
      max_pages: 2
    timeout_seconds: 10
    max_response_bytes: 500000

  - name: get_issue
    description: >-
      Gets one Jira issue by its key (for example IT-123), only if it is
      assigned to or reported by the signed-in user.
    method: GET
    path: /rest/api/2/search
    parameters:
      user: {in: template, identity: true}
      issue_key:
        in: template
        pattern: "^[A-Z][A-Z0-9_]{1,19}-[0-9]{1,9}$"
        description: The issue key, e.g. IT-123.
    required: [issue_key]
    templates:
      jql:
        language: jql
        parts:
          - "key = {issue_key}"
          - "AND (assignee = {user} OR reporter = {user})"
    fixed_query:
      fields: summary,status,priority,issuetype,assignee,reporter,created,updated,duedate,resolution,labels
      maxResults: 1
    response:
      root: issues
      fields: [key, fields.summary, fields.status.name, fields.priority.name,
               fields.issuetype.name, fields.assignee.displayName,
               fields.reporter.displayName, fields.created, fields.updated,
               fields.duedate, fields.resolution.name, fields.labels]
      max_items: 1
    timeout_seconds: 10
    max_response_bytes: 200000

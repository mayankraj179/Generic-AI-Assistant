assistant_id: hr_assistant_azure
display_name: HR Policy Assistant (Azure AI — TEMP testing)
description: TEMP testing config — same HR corpus and prompt as hr_assistant, answered by gpt-6-luna on Azure AI Foundry. Not a permanent provider decision.
tenant_id: bitwise-global

model:
  # TEMP (2026-09-30): Azure AI Foundry, OpenAI-compatible v1 API
  # (AzureAIProvider; endpoint from AZURE_AI_ENDPOINT, key from AZURE_AI_API_KEY).
  # Added for testing only; revisit before relying on it.
  provider: azure_ai
  model_name: gpt-6-luna
  supports_tools: true
  # AzureAIProvider.generate_stream() streams plain turns live (tool turns
  # run the tool loop first and arrive as one delta).
  supports_streaming: true
  thinking_level: null
  configurable_thinking: false
  max_context_tokens: 128000

retrieval:
  enabled: true
  collection_name: hr_policy_docs
  exact_search_threshold: 500
  top_k: 8
  # TEMP, measured 2026-09-29 against this assistant's gemini-embedding-001
  # chunks (travel_policy, bitwise_leave_policy, holidays_2026). Relevant top-1
  # 0.6906-0.7709 (n=10, correct document first every time, date lookups
  # included). Unrelated/off-domain top-1 up to 0.6244 (n=11; everyday
  # HR-adjacent questions like "office cafeteria" score 0.59-0.62). 0.66 is
  # mid-gap, but the gap is only ~0.066 (about +/-0.03 margin).
  min_similarity: 0.66
  # TEMP (2026-09-29): Gemini embeddings (gemini-embedding-001, the provider
  # default) so this Azure assistant isn't blocked by OpenRouter's daily
  # free-model quota (7 of 50 left when this was set up). Temporary testing
  # choice, not a decision: revisit the embedding provider for all TEMP configs.
  embedding_provider: gemini

named_queries:
  - name: employee_leave_balance
    description: Looks up the current leave balance for the requesting employee.
    sql_template: "SELECT balance_days FROM leave_balances WHERE employee_id = :principal_id"
    required_labels:
      - "role:employee"

enabled_tools: []

guardrails:
  prompt_injection_screening: true
  input_pii_block: false
  output_pii_block: false
  max_input_chars: 4000
  unsafe_output_patterns: []

system_prompt: >
  You are an HR policy assistant. Answer only from retrieved policy content
  and named-query results. Never invent policy details.

  Answer structure: when the retrieved content settles a yes/no or status
  question definitively — including when an item is absent from an explicit
  list that ends with a catch-all statement (e.g. "Rest all days are NOT
  Floating Holidays") — give the direct answer in the first sentence, in the
  form "No, <item> is not <status>." or "Yes, <item> is <status>.", then the
  supporting detail. If the retrieved content distinguishes specific categories
  or types of status for the same general concept (for example, different
  kinds of holiday, leave, or entitlement), the first sentence must name the
  specific category the item actually has: "Yes, <item> is a <specific
  category> (<name>)." or, when it has a different category from the one asked
  about, "No, <item> is a <specific category> (<name>), not a <asked
  category>." Never a bare "yes" or "no". When a list's rows only say Yes/No,
  the column header is the category. A question with no such distinction (e.g.
  a single count or amount) is answered directly as before. When a question has
  several parts (for example a date calculation and a status), answer each part
  directly, each in its own leading sentence, applying these rules to the
  status part. Do not write citation markers, source tags or bracketed
  references in the reply; the application lists the sources separately. Do
  not open with hedges like "Based on the
  provided content". When the answer rests on a catch-all statement, quote
  that statement rather than saying the item is not mentioned in the
  documents. This changes only how a supported answer is phrased, never when
  to decline: if the retrieved content does not settle the question, say
  plainly that it does not, exactly as before.

min_clearance: 0

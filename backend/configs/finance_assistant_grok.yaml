assistant_id: finance_assistant_grok
display_name: Financial Report Analysis Assistant (Grok)
description: Same finance corpus, prompt and tools as finance_assistant, answered by xAI Grok, for side-by-side comparison with the Nemotron-backed finance_assistant.
tenant_id: bitwise-global

model:
  # xAI directly (GrokProvider), not via OpenRouter. grok-4.3 is the cheapest
  # current general model in docs.x.ai/developers/models ($1.25/$2.50 per 1M).
  provider: xai
  model_name: grok-4.3
  supports_tools: true
  # GrokProvider.generate_stream() is not built yet. Nothing enforces this
  # flag, so /chat/stream would return an in-band error event for now.
  supports_streaming: false
  thinking_level: null
  configurable_thinking: false
  max_context_tokens: 128000

retrieval:
  enabled: true
  collection_name: finance_reports
  exact_search_threshold: 500
  top_k: 12
  # TEMP, measured 2026-09-29 against this assistant's gemini-embedding-001
  # chunks (nova_horizon_fy2025, bitwise_leave_policy, holidays_2026).
  # Relevant top-1 0.6619-0.7801 (n=13, correct document first every time;
  # "how much cash" 0.6619, gross margin 0.6730, revenue chart 0.7219).
  # Unrelated/off-domain top-1 up to 0.6287 (n=8). 0.645 is mid-gap, but the
  # gap is only ~0.033 (about +/-0.017 margin).
  min_similarity: 0.645
  # TEMP (2026-09-29): Gemini embeddings (gemini-embedding-001, the provider
  # default) so this Grok assistant isn't blocked by OpenRouter's daily
  # free-model quota. Temporary testing choice, not a decision: revisit the
  # embedding provider for all Grok configs later.
  embedding_provider: gemini

named_queries: []

# Read-only utility tools (app/tools/builtin.py) — no external dependencies,
# no side effects, no confirmation gate. "How many days until FY2026" /
# "what's the gross margin delta, computed precisely" are natural questions
# for this assistant, and giving the model calculate/current_datetime means
# it computes exact answers instead of estimating them from its own
# reasoning. max_tool_calls left at its default (4).
enabled_tools: [current_datetime, calculate]

guardrails:
  prompt_injection_screening: true
  input_pii_block: false
  output_pii_block: false
  max_input_chars: 4000
  unsafe_output_patterns: []

system_prompt: >
  You are a financial report analysis assistant. Answer only from the
  retrieved report content — never invent, estimate, or infer a figure that
  is not explicitly present in the retrieved context. Cite figures exactly
  as reported (e.g. state "$96.5M", never round it to "about $100M") unless
  the user explicitly asks for an approximate or rounded figure. If the
  user asks for a comparison, trend, or calculation whose inputs are not
  directly present together in the retrieved content, say so clearly
  rather than computing or approximating it from partial figures.

  Answer structure: when the retrieved content settles a yes/no or status
  question definitively — including when an item is absent from an explicit
  list that ends with a catch-all statement (e.g. "Rest all days are NOT
  Floating Holidays") — give the direct answer in the first sentence, in the
  form "No, <item> is not <status>." or "Yes, <item> is <status>.", then the
  supporting detail and source. If the retrieved content distinguishes
  specific categories or types of status for the same general concept (for
  example, different kinds of holiday, leave, or entitlement), the first
  sentence must name the specific category the item actually has, e.g.
  "Yes, <item> is a <specific category> (<name>).", not a generic "yes". When a
  list's rows only say Yes/No, the column header is the category. A question
  with no such distinction (e.g. a single count or amount) is answered directly
  as before. Do not open with hedges like "Based on the
  provided content". When the answer rests on a catch-all statement, quote
  that statement rather than saying the item is not mentioned in the
  documents. This changes only how a supported answer is phrased, never when
  to decline: if the retrieved content does not settle the question, say
  plainly that it does not, exactly as before.

min_clearance: 0

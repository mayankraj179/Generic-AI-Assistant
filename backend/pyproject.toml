[project]
name = "generic-ai-assistant-framework"
version = "0.1.0"
description = "Generic, config-driven AI assistant framework core"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyjwt[crypto]>=2.15.0",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.5",
    "redis>=5.1.0",
    "alembic>=1.13.3",
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.2",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    # object_storage knowledge sources (S3 and S3-compatible stores like MinIO).
    "boto3>=1.35.0",
    # database knowledge sources: validates each reviewed query, in its
    # engine's grammar, as a single read query (app/config/sql_safety.py).
    "sqlglot>=25.0.0",
    # connectors: validates model-supplied arguments against each operation's
    # input schema (app/connectors/runtime.py).
    "jsonschema>=4.0",
    # Python's stdlib zoneinfo has no bundled IANA database on Windows (or
    # any system lacking /usr/share/zoneinfo) — confirmed live: ZoneInfo("UTC")
    # itself raised ZoneInfoNotFoundError on this dev machine before adding
    # this. tzdata is the official CPython-recommended pure-Python fallback.
    "tzdata>=2024.1",
]

[tool.setuptools]
packages = [
    "app",
    "app.api",
    "app.auth",
    "app.config",
    "app.core",
    "app.db",
    "app.guardrails",
    "app.ingestion",
    "app.ingestion.sources",
    "app.orchestration",
    "app.services",
    "app.tools",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
]
# Drivers for database knowledge sources beyond PostgreSQL (asyncpg is a
# core dependency). Install only the engines you ingest from, e.g.
# pip install -e ".[mysql]". Versions listed are the ones tested.
mysql = ["pymysql>=1.1.0"]       # tested with PyMySQL 1.2.3 against MySQL 8.4
mssql = ["pymssql>=2.3.0"]       # tested with pymssql 2.4.3 against SQL Server 2022
oracle = ["oracledb>=2.0.0"]     # tested with python-oracledb 26.0.1 (thin) against Oracle 23ai Free
databases = ["pymysql>=1.1.0", "pymssql>=2.3.0", "oracledb>=2.0.0"]
# Only needed to export traces (OTEL_TRACES_EXPORTER=otlp, e.g. to local
# Jaeger). Pinned to the opentelemetry-api/sdk version google-adk installs.
tracing = ["opentelemetry-exporter-otlp-proto-http==1.42.1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
